name: دروازه کیفیت
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:http
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-frame-qa.txt
      - run: python -m pip install -r scripts/requirements-frame-qa.txt
      - run: npx tsx scripts/qa-frame-fixtures.ts
      - run: python scripts/qa-frame-independent.py
      - run: npx tsx scripts/qa-frame-capacity.ts
