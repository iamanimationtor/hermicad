name: دروازه کیفیت
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:http
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-frame-qa.txt
      - run: python -m pip install -r scripts/requirements-frame-qa.txt
      - run: npx tsx scripts/qa-frame-fixtures.ts
      - run: python scripts/qa-frame-independent.py
      - run: npx tsx scripts/qa-frame-capacity.ts
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hermicad_test
          POSTGRES_USER: hermicad_test
          POSTGRES_PASSWORD: hermicad-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermicad_test -d hermicad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HERMICAD_QA_POSTGRES_URL: postgresql://hermicad_test:hermicad-test-only@127.0.0.1:5432/hermicad_test
      HERMICAD_QA_ALLOW_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:http
