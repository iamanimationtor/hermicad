name: دروازه کیفیت
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:http
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-frame-qa.txt
      - run: python -m pip install -r scripts/requirements-frame-qa.txt
      - run: npx tsx scripts/qa-frame-fixtures.ts
      - run: python scripts/qa-frame-independent.py
      - run: npx tsx scripts/qa-frame-capacity.ts
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hermicad_test
          POSTGRES_USER: hermicad_test
          POSTGRES_PASSWORD: hermicad-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hermicad_test -d hermicad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      HERMICAD_QA_POSTGRES_URL: postgresql://hermicad_test:hermicad-test-only@127.0.0.1:5432/hermicad_test
      HERMICAD_QA_ALLOW_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:http

  # دود-تست جریان کامل کاربر روی یک سرور واقعیِ production.
  # چرا اینجا: lint/test/typecheck انسجام درونی را می‌سنجند، ولی این کار
  # مسیر واقعی مرورگر (کوکی، Origin، تولید طرح، استودیو، خروجی) را روی
  # همان خروجی build می‌آزماید. هر شکستی متن خطای واقعی سرور را چاپ می‌کند.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: production
      PGLITE_DATA_DIR: ${{ github.workspace }}/.data/smoke
      HERMICAD_ALLOW_PGLITE_IN_PRODUCTION: '1'
      HERMICAD_RUN_RETENTION: '5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: اجرای سرور و دود-تست
        run: |
          npx next start --port 3000 --hostname 127.0.0.1 > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "سرور آماده است (پس از ${i} تلاش)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::سرور در ۶۰ ثانیه بالا نیامد"
              cat "$RUNNER_TEMP/server.log"
              exit 1
            fi
            sleep 1
          done
          npm run test:smoke
      - name: گزارش لاگ سرور
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.log" ]; then
            echo "=== ۲۰۰ خط آخر لاگ سرور ==="
            tail -n 200 "$RUNNER_TEMP/server.log"
          fi
      - name: توقف سرور
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
          fi
